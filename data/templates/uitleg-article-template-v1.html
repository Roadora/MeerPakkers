<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ARTICLE_TITLE}} | MeerPakkers Uitleg</title>
  <meta name="description" content="{{ARTICLE_DESCRIPTION}}">
  <link rel="canonical" href="{{CANONICAL_URL}}">

  <!-- Existing global styles, kept intentionally explicit during migration. -->
  <link rel="stylesheet" href="/css/header.css">
  <link rel="stylesheet" href="/css/mobile-framework-v1.css">
  <link rel="stylesheet" href="/css/mobile-topbar-unified-v3.css">
  <link rel="stylesheet" href="/css/saved-deals-header-v50.css">
  <link rel="stylesheet" href="/css/uitleg-desktop-v1.css">
  <link rel="stylesheet" href="/css/footer.css">
  <link rel="stylesheet" href="/css/uitleg-article-template-v1.css">
<script src="/js/deal-lifecycle-v1.js"></script>
</head>
<body class="mp-uitleg-page mp-uitleg-page-body mp-uitleg-template-v1">
  <!-- The only mobile-header entrypoint for a migrated article. -->
  <div
    data-mp-uitleg-mobile-header
    data-back-href="/uitleg/"
    data-back-label="Terug naar uitleg"
    data-home-href="/"
    data-saved-href="/opgeslagen/"
    data-header-label="MeerPakkers uitleg header"></div>

  <!-- Copy the approved desktop header markup here during a migration. -->
  <header class="mp-desktop-header" aria-label="MeerPakkers desktop header">
    {{APPROVED_DESKTOP_HEADER_MARKUP}}
  </header>

  <main class="mp-uitleg-shell" id="main-content">
<article class="mp-uitleg-article mp-uitleg-article-card">
      <span class="mp-uitleg-kicker">MeerPakkers Uitleg</span>
      <h1>{{ARTICLE_TITLE}}</h1>
      <p class="lead">{{ARTICLE_LEAD}}</p>
      {{ARTICLE_CONTENT}}
    </article>

    {{OPTIONAL_RELEVANT_DEAL_OR_CTA}}
  </main>

  {{APPROVED_FOOTER_MARKUP}}

  <!-- The global topbar component must load before the uitleg renderer. -->
  <script src="/js/saved-deals-store-v46.js"></script>
  <script src="/js/saved-deals-ui-v47.js"></script>
  <script src="/js/mobile-topbar-component-v1.js"></script>
  <script src="/js/saved-deals-header-v50.js"></script>
  <script src="/js/uitleg-article-template-v1.js"></script>
  <script src="/js/cookie-banner-v40.js"></script>
</body>
</html>
